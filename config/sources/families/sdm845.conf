declare -g LINUXFAMILY="sdm845"
declare -g OVERLAY_DIR="/boot/dtb/qcom/overlay"
declare -g ARCH="arm64"
declare -g ATF_COMPILE="no"
declare -g BOOTENV_FILE="h845c-abl.txt"
enable_extension "image-output-abl"

case $BRANCH in

	legacy)
		declare -g KERNEL_MAJOR_MINOR="6.12"
		declare -g KERNELSOURCE="https://github.com/gregkh/linux.git"
		declare -g KERNELBRANCH="commit:fa5b06866b643cce7072a4e7c6be7ee3f0f1b95c"
		declare -g KERNELPATCHDIR="archive/sdm845-6.12"
		;;

	current)
		declare -g KERNEL_MAJOR_MINOR="6.18"
		declare -g KERNELSOURCE="https://github.com/gregkh/linux.git"
		declare -g KERNELBRANCH="commit:1cdda838e8475edf89b73ff0cc952005dd0b1fa7"
		declare -g KERNELPATCHDIR="archive/sdm845-6.18"
		;;

esac

family_tweaks_bsp() {
	:
}
