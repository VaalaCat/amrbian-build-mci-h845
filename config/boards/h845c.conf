# Baidu H845C (Qualcomm SDM845 octa-core 8GB RAM 256GB UFS)
# Target: serial console, UFS, dual USB Host + AX88179 GbE, Adreno 630 early firmware.
declare -g BOARD_NAME="Baidu H845C"
declare -g BOARD_VENDOR="baidu"
declare -g INTRODUCED="2026"
declare -g BOARDFAMILY="sdm845"
declare -g KERNEL_TARGET="legacy"
declare -g KERNEL_TEST_TARGET="legacy"
declare -g EXTRAWIFI="no"
declare -g CONSOLE_AUTOLOGIN="no"
declare -g BOOTCONFIG="none"
declare -g BOOTIMG_CMDLINE_EXTRA="scsi_mod.scan=manual clk_ignore_unused pd_ignore_unused loglevel=7 panic=30 allow_mismatched_32bit_el0 mem_sleep_default=s2idle earlycon=qcom_geni,0xa84000 console=ttyMSM0,115200n8"
declare -g IMAGE_PARTITION_TABLE="gpt"
declare -g -a ABL_DTB_LIST=("sdm845-h845c")
declare -g BOOT_FDT_FILE="qcom/sdm845-h845c.dtb"
declare -g ABL_HEADER_VERSION="0"
declare -g ABL_CMDLINE_SLOT_SUFFIX="_b"

# Pull complete linux-firmware + Armbian firmware for qcom/a630_sqe.fw and qcom/a630_gmu.bin.
declare -g BOARD_FIRMWARE_INSTALL="-full"

declare -g SERIALCON="${SERIALCON:-ttyMSM0}"

function post_family_tweaks_bsp__h845c_bsp_firmware_in_initrd() {
	display_alert "Adding to bsp-cli" "${BOARD}: Adreno 630 early firmware in initrd" "info"
	declare file_added_to_bsp_destination
	add_file_from_stdin_to_bsp_destination "/etc/initramfs-tools/hooks/qcom-a630-zap" <<- 'FIRMWARE_HOOK'
		#!/bin/sh
		PREREQ=""
		prereqs() { echo "$PREREQ"; }
		case "$1" in
			prereqs) prereqs; exit 0;;
		esac
		. /usr/share/initramfs-tools/hook-functions
		add_firmware "qcom/sdm845/a630_zap.mbn"
		add_firmware "qcom/a630_sqe.fw"
		add_firmware "qcom/a630_gmu.bin"
	FIRMWARE_HOOK
	run_host_command_logged chmod -v +x "${file_added_to_bsp_destination}"
}

function post_family_tweaks_bsp__h845c_ufs_boot() {
	declare file_added_to_bsp_destination
	add_file_from_stdin_to_bsp_destination "/etc/initramfs-tools/scripts/init-premount/h845c-ufs" <<- 'UFS_SCAN'
		#!/bin/sh
		[ "$1" != prereqs ] || exit 0
		read -r scan_mode < /sys/module/scsi_mod/parameters/scan || exit 0
		[ "$scan_mode" = manual ] || exit 0
		attempt=0
		while [ "$attempt" -lt 30 ]; do
			for host in /sys/bus/platform/devices/1d84000.ufshc/host[0-9]*; do
				number=${host##*host}
				[ -d "/sys/class/scsi_device/$number:0:0:49488" ] || continue
				printf '0 0 0\n' > "/sys/class/scsi_host/host$number/scan"
				exit $?
			done
			attempt=$((attempt + 1))
			sleep 1
		done
		echo "H845C: UFS management LUN is unavailable" >&2
		exit 1
	UFS_SCAN
	run_host_command_logged chmod +x "${file_added_to_bsp_destination}"

	# Grow ext4 inside the factory varfs partition.
	add_file_from_stdin_to_bsp_destination "/usr/lib/armbian/h845c-resize-varfs" <<- 'RESIZE_SCRIPT'
		#!/bin/bash
		fail() { echo "H845C varfs resize: $*" >&2; exit 1; }

		root_device_number=$(findmnt -rn -M / -t ext4 -O rw -o MAJ:MIN) &&
			[[ "$root_device_number" =~ ^[0-9]+:[0-9]+$ ]] || fail "No writable ext4 root device"
		root_partition=$(readlink -e "/sys/dev/block/$root_device_number") || fail "Cannot resolve root partition"
		ufs_controller=$(readlink -e /sys/bus/platform/devices/1d84000.ufshc) || fail "UFS controller not found"
		scsi_path=${root_partition#"$ufs_controller"/}
		[[ "$scsi_path" =~ ^host[0-9]+/target[0-9]+:0:0/[0-9]+:0:0:0/block/[^/]+/[^/]+$ ]] &&
			grep -qx '2' "$root_partition/partition" &&
			grep -Fxq 'PARTNAME=varfs' "$root_partition/uevent" || fail "Unexpected root partition: $root_partition"

		root_device=/dev/${root_partition##*/}
		[[ -b "$root_device" && $(stat -Lc '%Hr:%Lr' "$root_device") == "$root_device_number" ]] ||
			fail "Wrong block device: $root_device"
		resize2fs "$root_device" || fail "resize2fs failed on $root_device"
		touch /var/lib/h845c-varfs-resized || fail "Cannot record successful resize"
	RESIZE_SCRIPT
	run_host_command_logged chmod +x "${file_added_to_bsp_destination}"

	add_file_from_stdin_to_bsp_destination "/etc/systemd/system/armbian-resize-filesystem.service.d/h845c.conf" <<- 'RESIZE_SERVICE'
		[Unit]
		ConditionPathExists=!/root/.no_rootfs_resize
		ConditionPathExists=!/var/lib/h845c-varfs-resized

		[Service]
		ExecStart=
		ExecStart=/usr/lib/armbian/h845c-resize-varfs
	RESIZE_SERVICE
}
